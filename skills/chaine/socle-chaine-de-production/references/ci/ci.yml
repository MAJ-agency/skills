# CI minimale de la chaîne de production (skill socle-chaine-de-production).
# Deux jobs exigés par la protection de develop : `qualite` (pnpm check, gates, tickets, tests sans
# infrastructure) et `test-db` (les suites Postgres de l'API). Un push de session sur une PR brouillon
# ne lance rien ; la PR sort du brouillon après son dernier push. Les E2E, quand ils existent, s'ajoutent
# ici en job séparé joué au passage du capitaine (label `ci-complète` pour les avancer).
name: CI
on:
  pull_request:
    branches: ['develop', 'main', 'sujet/**']
    # `ready_for_review` n'est pas dans les types par défaut : sans lui, une PR qui sort du
    # brouillon garde ses jobs « skipped » jusqu'au push suivant, et rien ne tourne jamais.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['develop', 'main']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qualite:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:gates
      - run: pnpm check:tickets
      - run: pnpm check:commit
      # Même calcul que le capitaine (scripts/chaine/passer.sh) : l'auteur voit le refus avant lui.
      - name: Ordre des migrations (PR vers develop)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
        run: node scripts/chaine/migrations-ordre.mjs origin/develop HEAD
      - name: Messages de commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec node scripts/chaine/commits-a-relire.mjs --de "$BASE_SHA" --a "$HEAD_SHA" --hors origin/develop
  test-db:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: {{PROJET_SNAKE}}, POSTGRES_PASSWORD: {{PROJET_SNAKE}}, POSTGRES_DB: {{PROJET_SNAKE}}_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @{{SCOPE}}/{{PROJET}}-api test:db
        env:
          DATABASE_URL: postgres://{{PROJET_SNAKE}}:{{PROJET_SNAKE}}@localhost:5432/{{PROJET_SNAKE}}_test
          DATABASE_MIGRATOR_URL: postgres://{{PROJET_SNAKE}}:{{PROJET_SNAKE}}@localhost:5432/{{PROJET_SNAKE}}_test
  zizmor:
    # Audit des workflows GitHub Actions : injection par gabarit, actions non épinglées,
    # pull_request_target, permissions trop larges. Version épinglée.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: python3 -m pip install --user --quiet zizmor==1.31.0
      - run: zizmor --min-severity medium .github/workflows
