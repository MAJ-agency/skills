# Mutation (skill socle-tests, ADR « score de mutation »), posé dans `.github/workflows/mutation.yml`.
#  - chaque dimanche, heure creuse : la mutation des règles prouvées (`regles`) ;
#  - à la demande (Actions → Mutation → Run workflow) : `regles`, ou `noyau` (le plancher du noyau critique).
# Jamais à chaque PR. Sans index Anchorpost, `regles` sort vert, ne mute rien et le dit dans le journal.
# `regles` ne refuse rien : le rapport des survivants par règle est écrit dans le résumé du job.
name: Mutation
on:
  workflow_dispatch:
    inputs:
      cible:
        description: noyau (plancher du noyau critique) ou regles (survivants des règles prouvées)
        type: choice
        options: [regles, noyau]
        default: regles
  schedule:
    - cron: '43 3 * * 0' # dimanche, 03 h 43 UTC
concurrency:
  group: mutation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # La saisie passe par l'environnement, jamais par un `run:` (injection) ; le déclenchement
      # planifié n'a pas de saisie : `regles`.
      CIBLE: ${{ inputs.cible || 'regles' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Le noyau critique, avec son plancher
        if: env.CIBLE == 'noyau'
        run: pnpm --filter @{{SCOPE}}/{{PROJET}}-api mutation
      - name: Les règles prouvées, rapport des survivants
        if: env.CIBLE == 'regles'
        run: pnpm --filter @{{SCOPE}}/{{PROJET}}-api mutation:regles
      - name: Rapports HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-mutation
          path: apps/api/reports
          if-no-files-found: ignore
          retention-days: 30
