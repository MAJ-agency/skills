# Mutation (skill socle-tests, ADR « score de mutation »), posé dans `.github/workflows/mutation.yml`.
#  - chaque dimanche, heure creuse : la mutation des règles qui ont des preuves (`regles`) ;
#  - à la demande (Actions → Mutation → Run workflow) : `noyau` (le plancher du noyau critique, par
#    défaut) ou `regles`.
# Jamais à chaque PR. Sans index Anchorpost, `regles` sort vert, ne mute rien et le dit dans le résumé.
# `regles` ne refuse rien : la synthèse par règle (criticité, score ou « non mesurée », survivants) est écrite dans le
# résumé du job, datée. La mesure, en JSON, est publiée en artefact (`mesure-regles`) : le passage suivant relit le dernier
# artefact de ce nom sur la branche par défaut et dit chaque baisse de score d'une règle moyenne. Elle ne vit ni dans
# l'index ni dans le dépôt.
name: Mutation
on:
  workflow_dispatch:
    inputs:
      cible:
        description: 'Périmètre muté : noyau (plancher) ou regles (rapport seulement)'
        type: choice
        options: [noyau, regles]
        default: noyau
  schedule:
    - cron: '43 3 * * 0' # dimanche, 03 h 43 UTC
permissions:
  contents: read
  actions: read # lire l'artefact de la mesure précédente
concurrency:
  group: mutation
  cancel-in-progress: false
jobs:
  mutation:
    name: Score de mutation (Stryker)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # La saisie passe par l'environnement, jamais par un `run:` (injection) ; le déclenchement
      # planifié n'a pas de saisie : `regles`.
      CIBLE: ${{ github.event_name == 'schedule' && 'regles' || inputs.cible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Mutation du noyau
        if: env.CIBLE == 'noyau'
        run: pnpm --filter @{{SCOPE}}/{{PROJET}}-api mutation
      - name: Mesure précédente
        # Le dernier artefact `mesure-regles` de la branche par défaut ; aucun, ou illisible : la synthèse le dit.
        if: env.CIBLE == 'regles'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/precedente"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mesure-regles&per_page=30" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == env.BRANCHE)][0].workflow_run.id // empty') || id=''
          if [ -n "$id" ]; then gh run download "$id" -n mesure-regles -D "$RUNNER_TEMP/precedente" || echo "mesure précédente illisible"; else echo "aucune mesure précédente"; fi
      - name: Mutation des règles qui ont des preuves
        if: env.CIBLE == 'regles'
        run: pnpm --filter @{{SCOPE}}/{{PROJET}}-api mutation:regles
      - name: Synthèse par règle
        # `always()` : un passage interrompu (délai, Stryker tué) dit « pas de rapport » au lieu de se taire.
        if: env.CIBLE == 'regles' && always()
        working-directory: apps/api
        run: node ../../scripts/verify/mutation-regles-synthese.mjs --mesure reports/mutation/mesure-regles.json --precedente "$RUNNER_TEMP/precedente/mesure-regles.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Mesure datée
        if: env.CIBLE == 'regles' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesure-regles
          path: apps/api/reports/mutation/mesure-regles.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-mutation-${{ env.CIBLE }}
          path: apps/api/reports/mutation/
          if-no-files-found: ignore
          retention-days: 28
