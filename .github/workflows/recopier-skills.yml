# Recopie les skills de la chaîne dans chaque projet de scripts/recopie-projets.json et y ouvre une PR.
# Mode d'emploi, réglage du secret RECOPIE_TOKEN et limites : docs/agents/recopie-des-skills.md.
name: Recopier les skills
on:
  push:
    branches: ['main']
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  liste:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      projets: ${{ steps.lire.outputs.projets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - id: lire
        run: echo "projets=$(jq -c '.projets' scripts/recopie-projets.json)" >> "$GITHUB_OUTPUT"
  recopie:
    needs: liste
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        projet: ${{ fromJSON(needs.liste.outputs.projets) }}
    # Une exécution en attente par projet : la dernière gagne, et elle copie l'état de main.
    concurrency:
      group: recopie-${{ matrix.projet.depot }}
      cancel-in-progress: false
    steps:
      - name: Vérifier le jeton d'écriture
        env:
          RECOPIE_TOKEN: ${{ secrets.RECOPIE_TOKEN }}
        run: |
          if [ -z "$RECOPIE_TOKEN" ]; then
            echo "jeton d'écriture absent (secret RECOPIE_TOKEN) : voir docs/agents/recopie-des-skills.md" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # Seule récupération qui garde son jeton : c'est lui qui pousse dans le projet.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ matrix.projet.depot }}
          ref: ${{ matrix.projet.branche }}
          path: projet
          token: ${{ secrets.RECOPIE_TOKEN }}
      - name: Recopier les skills
        run: node scripts/recopier-skills.mjs projet
      - name: Refuser un projet qui ignore .claude/skills/
        working-directory: projet
        run: |
          if git check-ignore -q .claude/skills/maj-skills.json; then
            echo ".claude/skills/ est ignoré par git dans ce projet : voir docs/agents/recopie-des-skills.md" >&2
            exit 1
          fi
      - name: Commit, branche et PR
        working-directory: projet
        env:
          GH_TOKEN: ${{ secrets.RECOPIE_TOKEN }}
          DEPOT: ${{ matrix.projet.depot }}
          BASE: ${{ matrix.projet.branche }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "$DEPOT : la copie est déjà à jour, rien à ouvrir."
            exit 0
          fi
          VERSION=$(jq -r '.version' .claude/skills/maj-skills.json)
          TITRE="chore(skills): recopie de maj-skills $VERSION"
          CORPS=$(printf '%s\n' \
            "Recopie des skills de la chaîne, version $VERSION de MAJ-agency/skills." \
            "Mode d'emploi : docs/agents/recopie-des-skills.md dans MAJ-agency/skills." \
            "La copie ne se modifie pas dans ce projet : une modification se fait dans skills.")
          BRANCHE=chore/recopie-maj-skills
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCHE"
          git add -A .claude/skills
          git commit -m "$TITRE"
          git push --force origin "$BRANCHE"
          if [ -z "$(gh pr list --repo "$DEPOT" --head "$BRANCHE" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$DEPOT" --head "$BRANCHE" --base "$BASE" --title "$TITRE" --body "$CORPS" --label "à-fusionner"
          else
            gh pr edit "$BRANCHE" --repo "$DEPOT" --title "$TITRE" --body "$CORPS" --add-label "à-fusionner"
          fi
