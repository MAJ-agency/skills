# Contrôle automatique d'une PR vers main : installer le dépôt, puis jouer tous les bancs (`pnpm test`).
# Le nom du job (`bancs`) est celui qu'un administrateur rend obligatoire dans la protection de main.
# Ni `packageManager` ni `.nvmrc` dans ce dépôt : les versions de Node et de pnpm sont données ici.
name: CI
on:
  pull_request:
    branches: ['main']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bancs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10.28.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
